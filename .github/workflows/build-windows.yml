name: Build Windows desktop package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "installer-release/**"
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kasirkita-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build and test Windows distribution
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.8"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned build dependencies
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install -r requirements-build.txt
      - name: Compile application and tests
        run: python -m compileall -q kasirkita tests
      - name: Run automated tests
        run: python -m unittest discover -v
      - name: Generate KasirKita brand assets
        run: python scripts/generate_brand_assets.py
      - name: Verify generated application branding
        shell: pwsh
        run: |
          foreach ($path in @("assets/icons/kasirkita.ico", "assets/brand/kasirkita-logo.png")) {
            if (-not (Test-Path $path)) { throw "Required brand asset was not generated: $path" }
          }
      - name: Build directory-based Windows application
        run: pyinstaller --clean --noconfirm kasirkita.spec
      - name: Create portable package and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/KasirKita | Out-Null
          if (-not (Test-Path "dist/KasirKita/KasirKita.exe")) {
            throw "Expected onedir executable was not created."
          }
          Copy-Item -Path "dist/KasirKita/*" -Destination "package/KasirKita" -Recurse -Force
          Copy-Item docs/PANDUAN_PENGGUNA.md package/PANDUAN_PENGGUNA.md
          $versionText = Get-Content "kasirkita/__init__.py" -Raw
          if ($versionText -notmatch '__version__\s*=\s*"([^"]+)"') {
            throw "Application version could not be read from kasirkita/__init__.py"
          }
          $appVersion = $Matches[1]
          @(
            "KasirKita Desktop v$appVersion"
            "Dikembangkan oleh The Choco Studios."
            "Jalankan KasirKita.exe dari folder KasirKita."
            "Paket portable berisi executable dan file runtime pendamping."
            "Data aplikasi disimpan pada folder data pengguna Windows."
            "Jangan hapus folder data pengguna saat memperbarui aplikasi."
            "Buat dan verifikasi backup sebelum memulihkan atau mengganti versi."
            "Baca PANDUAN_PENGGUNA.md sebelum mulai menggunakan aplikasi."
          ) | Set-Content -Encoding UTF8 package/PETUNJUK.txt
          Compress-Archive -Path package/* -DestinationPath KasirKita-Windows-Portable.zip -Force
          Get-FileHash KasirKita-Windows-Portable.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  KasirKita-Windows-Portable.zip" } |
            Set-Content -Encoding ASCII KasirKita-Windows-Portable.sha256
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler not found: $compiler"
          }
          & $compiler /Qp installer/KasirKita.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path "KasirKita-Setup.exe")) {
            throw "Installer output was not created."
          }
          Get-FileHash KasirKita-Setup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  KasirKita-Setup.exe" } |
            Set-Content -Encoding ASCII KasirKita-Setup.sha256
      - name: Upload package for owner-triggered manual build only
        if: github.event_name == 'workflow_dispatch' && github.actor == 'chocoanakbaik'
        uses: actions/upload-artifact@v4
        with:
          name: KasirKita-Windows-Release-Python38
          path: |
            KasirKita-Windows-Portable.zip
            KasirKita-Windows-Portable.sha256
            KasirKita-Setup.exe
            KasirKita-Setup.sha256
          if-no-files-found: error
