name: KasirKita tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kasirkita-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.8 is retained for the current PyInstaller 5 packaging baseline.
          # Pin Ubuntu 22.04 because ubuntu-latest has moved to a runner image
          # that no longer provides Python 3.8 through actions/setup-python.
          - os: ubuntu-22.04
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install document export dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Compile all Python modules
        run: python -m compileall -q kasirkita tests

      - name: Run unit and integration test discovery
        run: python -m unittest discover -v
